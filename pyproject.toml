[project]
name = "autoclipper"
version = "0.1.0"
description = "Finds the moments live-stream chat reacts to and posts them as subtitled Shorts and Reels."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Bhuvanesh Sunder Raj" }]
requires-python = ">=3.12"
dependencies = [
    "websockets",
    "google-api-python-client",
    "google-auth-oauthlib",
    "keyring",
    "streamlink>=8.6.3",
    "faster-whisper>=1.2.1",
    "pillow>=13.0.0",
    "playwright>=1.65.2",
    "numpy>=2.5.5",
]

[project.scripts]
autoclipper = "autoclipper.cli:main"

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
