<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="autoclipper logo">
  <defs>
    <linearGradient id="bg" x1="12" y1="8" x2="116" y2="122" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="52%" stop-color="#e11d48"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>
    <radialGradient id="glow" cx="64" cy="56" r="46" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- macOS squircle base with dual-theme edge contrast -->
  <rect x="2" y="2" width="124" height="124" rx="28" fill="url(#bg)"/>
  <rect x="2" y="2" width="124" height="124" rx="28" fill="url(#glow)"/>
  <rect x="2.75" y="2.75" width="122.5" height="122.5" rx="27.25" fill="none" stroke="#881337" stroke-opacity="0.45" stroke-width="1.5"/>
  <rect x="4" y="4" width="120" height="120" rx="26" fill="none" stroke="#ffffff" stroke-opacity="0.28" stroke-width="1.5"/>

  <!-- 9:16 vertical Short viewfinder frame -->
  <rect x="39" y="21" width="50" height="86" rx="11" fill="#0e1017" fill-opacity="0.24" stroke="#ffffff" stroke-width="4.5"/>

  <!-- Subtle bottom subtitle cue bar inside the Short frame -->
  <rect x="50" y="92" width="28" height="5" rx="2.5" fill="#ffe14d" fill-opacity="0.95"/>

  <!-- Live chat-spike waveform casing for clean frame overlap -->
  <path d="M 15 74 L 38 74 L 46 74 L 52 84 L 64 40 L 76 80 L 82 74 L 113 74"
        fill="none" stroke="#9f1239" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Live chat-spike waveform -->
  <path d="M 15 74 L 38 74 L 46 74 L 52 84 L 64 40 L 76 80 L 82 74 L 113 74"
        fill="none" stroke="#ffffff" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Highlight peak dot (matches render.py HIGHLIGHT #ffe14d) -->
  <circle cx="64" cy="40" r="10.5" fill="#ffe14d" fill-opacity="0.28"/>
  <circle cx="64" cy="40" r="6" fill="#ffe14d" stroke="#9f1239" stroke-width="1.5"/>
</svg>
