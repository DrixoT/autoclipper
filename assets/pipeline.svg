  <text x="450" y="344" text-anchor="end" fill="#6d758c" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="9.5">SINGLE MAC · LAUNCHD</text>

  <g font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="10" fill="#d1fae5">
    <rect x="44" y="355" width="144" height="22" rx="6" fill="#34d399" fill-opacity="0.10" stroke="#34d399" stroke-opacity="0.25"/>
    <text x="116" y="369.5" text-anchor="middle">max_uploads_per_day</text>

    <rect x="196" y="355" width="122" height="22" rx="6" fill="#34d399" fill-opacity="0.10" stroke="#34d399" stroke-opacity="0.25"/>
