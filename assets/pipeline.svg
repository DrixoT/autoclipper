    <rect x="320" y="384" width="130" height="22" rx="6" fill="#34d399" fill-opacity="0.10" stroke="#34d399" stroke-opacity="0.25"/>
    <text x="385" y="398.5" text-anchor="middle">Never post twice</text>
  </g>

  <!-- Bottom Rail Right: Learning Loop -->
  <rect x="492" y="322" width="440" height="96" rx="12" fill="#181c28" stroke="#ffe14d" stroke-opacity="0.35"/>
  <text x="508" y="344" fill="#ffe14d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1">LEARNING LOOP</text>
  <text x="916" y="344" text-anchor="end" fill="#6d758c" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="9.5">learning.db</text>

  <text x="508" y="366" fill="#f4f5f8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11">Records scored candidates, verdicts &amp; 1 · 6 · 24 · 72 h snapshots</text>
  <text x="508" y="385" fill="#9ba3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5">Bounded refits (weights 0.05–0.40, F ≥ 3.5) · ~1 in 10 exploration</text>
  <text x="508" y="403" fill="#9ba3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5">Top 3 posts replace prompt examples · zero extra LLM calls</text>
