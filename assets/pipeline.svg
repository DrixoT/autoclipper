  <rect x="504" y="112" width="182" height="78" rx="8" fill="#12151f" stroke="#a78bfa" stroke-opacity="0.45"/>
  <text x="516" y="129" fill="#f4f5f8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="700">TypeSafe Jev</text>
  <rect x="640" y="118" width="36" height="16" rx="8" fill="#a78bfa" fill-opacity="0.18"/>
  <text x="658" y="129" text-anchor="middle" fill="#c4b5fd" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="9" font-weight="600">API</text>
  <text x="516" y="146" fill="#9ba3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10">4 frames + chat → 6 scores</text>
  <text x="516" y="162" fill="#fda4af" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10">nude ≥ 0.3 → fail-closed</text>
  <text x="516" y="178" fill="#ffe14d" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="9.5">slot ≥ 0.45 · fast ≥ 0.80</text>

  <rect x="504" y="196" width="182" height="40" rx="8" fill="#12151f" stroke="#252a38"/>
  <text x="516" y="212" fill="#6ee7b7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="600">faster-whisper (local)</text>
  <text x="516" y="227" fill="#9ba3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10">Word-level timestamps</text>

  <rect x="504" y="242" width="182" height="42" rx="8" fill="#12151f" stroke="#a78bfa" stroke-opacity="0.45"/>
  <text x="516" y="259" fill="#f4f5f8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="700">Claude Haiku</text>
  <rect x="640" y="248" width="36" height="16" rx="8" fill="#a78bfa" fill-opacity="0.18"/>
  <text x="658" y="259" text-anchor="middle" fill="#c4b5fd" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="9" font-weight="600">API</text>
  <text x="516" y="275" fill="#9ba3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10">Story · Short · hook · title</text>

