  <rect x="724" y="72" width="208" height="224" rx="12" fill="#181c28" stroke="#2a3042"/>
  <text x="738" y="96" fill="#f4f5f8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="700">4 · RENDER &amp; POST</text>
  <rect x="866" y="81" width="54" height="20" rx="10" fill="#e11d48" fill-opacity="0.16" stroke="#f43f5e" stroke-opacity="0.40"/>
  <text x="893" y="94.5" text-anchor="middle" fill="#fda4af" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="9.5" font-weight="600">MACOS</text>

  <rect x="736" y="112" width="184" height="46" rx="8" fill="#12151f" stroke="#252a38"/>
  <text x="748" y="130" fill="#f4f5f8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="600">Pillow + VideoToolbox</text>
  <text x="748" y="147" fill="#9ba3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10">-14 LUFS · box / emoji</text>

  <rect x="736" y="166" width="184" height="58" rx="8" fill="#12151f" stroke="#ffe14d" stroke-opacity="0.38"/>
