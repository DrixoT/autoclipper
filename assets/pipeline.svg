<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 436" width="960" height="436" role="img" aria-label="autoclipper end-to-end architecture diagram">
  <defs>
    <linearGradient id="cardBg" x1="0" y1="0" x2="960" y2="436" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0e1017"/>
      <stop offset="100%" stop-color="#131620"/>
    </linearGradient>
    <linearGradient id="spikeFill" x1="0" y1="138" x2="0" y2="174" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#f43f5e" stop-opacity="0.02"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 1.5 L 8.5 5 L 1 8.5 z" fill="#6d758c"/>
    </marker>
    <marker id="arrowYellow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 1.5 L 8.5 5 L 1 8.5 z" fill="#ffe14d"/>
    </marker>
  </defs>

  <!-- Studio card -->
  <rect x="0.5" y="0.5" width="959" height="435" rx="16" fill="url(#cardBg)" stroke="#252a38"/>

  <!-- Header -->
  <text x="28" y="38" fill="#f4f5f8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.4">HOW AUTOCLIPPER WORKS</text>

  <!-- Legend pills -->
  <g font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="10" font-weight="600">
    <rect x="498" y="21" width="138" height="24" rx="12" fill="#34d399" fill-opacity="0.14" stroke="#34d399" stroke-opacity="0.35"/>
    <circle cx="513" cy="33" r="3.5" fill="#34d399"/>
    <text x="524" y="36.5" fill="#6ee7b7">LOCAL · $0 COST</text>

    <rect x="646" y="21" width="150" height="24" rx="12" fill="#a78bfa" fill-opacity="0.15" stroke="#a78bfa" stroke-opacity="0.38"/>
    <circle cx="661" cy="33" r="3.5" fill="#a78bfa"/>
    <text x="672" y="36.5" fill="#c4b5fd">API · 2 SMALL CALLS</text>

    <rect x="806" y="21" width="126" height="24" rx="12" fill="#e11d48" fill-opacity="0.16" stroke="#f43f5e" stroke-opacity="0.40"/>
    <circle cx="821" cy="33" r="3.5" fill="#f43f5e"/>
    <text x="832" y="36.5" fill="#fda4af">GUARDS &amp; LOOP</text>
  </g>

  <line x1="28" y1="58" x2="932" y2="58" stroke="#252a38"/>

  <!-- Column connectors -->
  <line x1="234" y1="184" x2="255" y2="184" stroke="#6d758c" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="466" y1="184" x2="487" y2="184" stroke="#6d758c" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="698" y1="184" x2="719" y2="184" stroke="#6d758c" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- Column 1: Watch -->
  <rect x="28" y="72" width="206" height="224" rx="12" fill="#181c28" stroke="#2a3042"/>
  <text x="42" y="96" fill="#f4f5f8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="700">1 · WATCH</text>
  <rect x="168" y="81" width="54" height="20" rx="10" fill="#34d399" fill-opacity="0.14" stroke="#34d399" stroke-opacity="0.35"/>
  <text x="195" y="94.5" text-anchor="middle" fill="#6ee7b7" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="9.5" font-weight="600">LOCAL</text>

  <rect x="40" y="112" width="182" height="58" rx="8" fill="#12151f" stroke="#252a38"/>
  <text x="52" y="129" fill="#6ee7b7" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="10.5" font-weight="600">[discover]</text>
  <text x="52" y="145" fill="#f4f5f8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="600">Twitch · Kick · YT pin</text>
  <text x="52" y="160" fill="#9ba3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10">≤5 streams · clip filter</text>

  <rect x="40" y="178" width="182" height="50" rx="8" fill="#12151f" stroke="#252a38"/>
  <text x="52" y="198" fill="#f4f5f8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="600">Streamlink + ffmpeg</text>
  <text x="52" y="215" fill="#9ba3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10">4 s .ts · 10-min ring</text>

  <rect x="40" y="236" width="182" height="48" rx="8" fill="#12151f" stroke="#252a38"/>
  <text x="52" y="255" fill="#f4f5f8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="600">Chat readers (no login)</text>
  <text x="52" y="272" fill="#9ba3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10">IRC · WS · YT Live chat</text>

  <!-- Column 2: Detect & Gate -->
  <rect x="260" y="72" width="206" height="224" rx="12" fill="#181c28" stroke="#2a3042"/>
  <text x="274" y="96" fill="#f4f5f8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="700">2 · DETECT</text>
  <rect x="400" y="81" width="54" height="20" rx="10" fill="#34d399" fill-opacity="0.14" stroke="#34d399" stroke-opacity="0.35"/>
  <text x="427" y="94.5" text-anchor="middle" fill="#6ee7b7" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="9.5" font-weight="600">LOCAL</text>

  <rect x="272" y="112" width="182" height="76" rx="8" fill="#12151f" stroke="#252a38"/>
  <text x="284" y="129" fill="#f4f5f8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="600">Chat velocity</text>
  <text x="442" y="129" text-anchor="end" fill="#f43f5e" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="10" font-weight="600">z ≥ 2.5</text>
  <!-- Mini spike waveform -->
  <line x1="284" y1="147" x2="442" y2="147" stroke="#f43f5e" stroke-opacity="0.45" stroke-dasharray="3 3"/>
  <path d="M 284 166 L 326 165 L 344 163 L 358 166 L 372 135 L 385 162 L 402 165 L 442 166 L 442 172 L 284 172 Z" fill="url(#spikeFill)"/>
  <path d="M 284 166 L 326 165 L 344 163 L 358 166 L 372 135 L 385 162 L 402 165 L 442 166" fill="none" stroke="#f43f5e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="372" cy="135" r="3" fill="#ffe14d"/>
  <text x="284" y="180" fill="#9ba3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="9.5">≥8 chatters · ≥25% match</text>

  <rect x="272" y="196" width="182" height="42" rx="8" fill="#12151f" stroke="#252a38"/>
  <text x="284" y="213" fill="#f4f5f8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="600">Lossless ring copy</text>
  <text x="284" y="229" fill="#9ba3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10">raw.ts (no re-encode)</text>

  <rect x="272" y="244" width="182" height="40" rx="8" fill="#12151f" stroke="#34d399" stroke-opacity="0.32"/>
  <text x="284" y="260" fill="#6ee7b7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="600">Freeze + silence gate</text>
  <text x="284" y="275" fill="#9ba3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10">Drop if &gt;50% frozen/mute</text>

  <!-- Column 3: Rank & Edit -->
  <rect x="492" y="72" width="206" height="224" rx="12" fill="#181c28" stroke="#2a3042"/>
  <text x="506" y="96" fill="#f4f5f8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="700">3 · RANK &amp; EDIT</text>
  <rect x="622" y="81" width="64" height="20" rx="10" fill="#a78bfa" fill-opacity="0.15" stroke="#a78bfa" stroke-opacity="0.38"/>
