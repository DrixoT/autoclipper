  <text x="748" y="199" fill="#9ba3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10">Data API v3 → Studio</text>
  <text x="748" y="214" fill="#9ba3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10">Per-variant profiles</text>

  <rect x="736" y="232" width="184" height="52" rx="8" fill="#12151f" stroke="#252a38"/>
  <text x="748" y="249" fill="#f4f5f8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="600">Optional companions</text>
  <text x="748" y="264" fill="#9ba3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10">16:9 video (1920×1080)</text>
  <text x="748" y="278" fill="#9ba3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10">Instagram Reels (≤50 s)</text>

  <!-- Feedback arrow from Learning Loop back to Rank & Edit -->
  <line x1="595" y1="322" x2="595" y2="300" stroke="#ffe14d" stroke-width="1.5" stroke-dasharray="3 3" marker-end="url(#arrowYellow)"/>
  <text x="605" y="313" fill="#ffe14d" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="9.5">refits weights, bars &amp; examples</text>

