<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 356" width="960" height="356" role="img" aria-label="Bounded statistical learning loop diagram">
  <defs>
    <linearGradient id="cardBg" x1="0" y1="0" x2="960" y2="356" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0e1017"/>
      <stop offset="100%" stop-color="#131620"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 1.5 L 8.5 5 L 1 8.5 z" fill="#6d758c"/>
    </marker>
  </defs>

  <!-- Studio card -->
  <rect x="0.5" y="0.5" width="959" height="355" rx="16" fill="url(#cardBg)" stroke="#252a38"/>

  <!-- Header -->
  <text x="28" y="37" fill="#f4f5f8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.4">BOUNDED STATISTICAL LEARNING LOOP</text>
  <text x="932" y="37" text-anchor="end" fill="#6d758c" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="10">CONSTRAINED UPDATES · NO PROMPT SELF-REWRITES</text>

  <!-- Stage connectors -->
  <line x1="292" y1="176" x2="316" y2="176" stroke="#6d758c" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="604" y1="176" x2="628" y2="176" stroke="#6d758c" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- ==================== COLUMN 1: RECORD ==================== -->
  <rect x="28" y="58" width="264" height="236" rx="12" fill="#181c28" stroke="#2a3042"/>
  <text x="44" y="82" fill="#f4f5f8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="700">1 · RECORD</text>
  <rect x="190" y="67" width="88" height="20" rx="10" fill="#34d399" fill-opacity="0.14" stroke="#34d399" stroke-opacity="0.35"/>
  <text x="234" y="80.5" text-anchor="middle" fill="#6ee7b7" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="9.5" font-weight="600">learning.db</text>

  <rect x="42" y="98" width="236" height="82" rx="8" fill="#12151f" stroke="#252a38"/>
  <text x="54" y="117" fill="#f4f5f8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="600">Every scored candidate</text>
  <text x="54" y="135" fill="#9ba3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5">• 6 Jev subscores &amp; rank</text>
  <text x="54" y="152" fill="#9ba3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5">• Editor keep / drop verdict</text>
  <text x="54" y="168" fill="#6d758c" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="9.5">  (unrecorded when editor at cap)</text>

  <rect x="42" y="188" width="236" height="94" rx="8" fill="#12151f" stroke="#252a38"/>
  <text x="54" y="207" fill="#f4f5f8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="600">Public post snapshots</text>
  <!-- 4 snapshot timeline badges with segmented connectors so lines never strike through text -->
  <line x1="94" y1="227" x2="112" y2="227" stroke="#ffe14d" stroke-opacity="0.50" stroke-width="1.5"/>
  <line x1="150" y1="227" x2="168" y2="227" stroke="#ffe14d" stroke-opacity="0.50" stroke-width="1.5"/>
  <line x1="208" y1="227" x2="224" y2="227" stroke="#ffe14d" stroke-opacity="0.50" stroke-width="1.5"/>
  <g font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="9.5" font-weight="700" text-anchor="middle">
    <rect x="56" y="217" width="38" height="20" rx="10" fill="#12151f"/>
    <rect x="56" y="217" width="38" height="20" rx="10" fill="#ffe14d" fill-opacity="0.16" stroke="#ffe14d" stroke-opacity="0.50"/>
    <text x="75" y="230.5" fill="#ffe14d">1 h</text>

    <rect x="112" y="217" width="38" height="20" rx="10" fill="#12151f"/>
    <rect x="112" y="217" width="38" height="20" rx="10" fill="#ffe14d" fill-opacity="0.16" stroke="#ffe14d" stroke-opacity="0.50"/>
    <text x="131" y="230.5" fill="#ffe14d">6 h</text>

    <rect x="168" y="217" width="40" height="20" rx="10" fill="#12151f"/>
    <rect x="168" y="217" width="40" height="20" rx="10" fill="#ffe14d" fill-opacity="0.16" stroke="#ffe14d" stroke-opacity="0.50"/>
    <text x="188" y="230.5" fill="#ffe14d">24 h</text>

    <rect x="224" y="217" width="40" height="20" rx="10" fill="#12151f"/>
    <rect x="224" y="217" width="40" height="20" rx="10" fill="#ffe14d" fill-opacity="0.16" stroke="#ffe14d" stroke-opacity="0.50"/>
    <text x="244" y="230.5" fill="#ffe14d">72 h</text>
  </g>
  <text x="54" y="255" fill="#9ba3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10">Views &amp; likes (never pauses uploads)</text>
  <text x="54" y="271" fill="#9ba3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10">+ optional --analytics watch-through</text>

  <!-- ==================== COLUMN 2: LABEL & EXPLORE ==================== -->
  <rect x="322" y="58" width="282" height="236" rx="12" fill="#181c28" stroke="#2a3042"/>
  <text x="338" y="82" fill="#f4f5f8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="700">2 · LABEL &amp; EXPLORE</text>
  <rect x="524" y="67" width="66" height="20" rx="10" fill="#a78bfa" fill-opacity="0.15" stroke="#a78bfa" stroke-opacity="0.38"/>
  <text x="557" y="80.5" text-anchor="middle" fill="#c4b5fd" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="9.5" font-weight="600">y ∈ [0,1]</text>

  <rect x="336" y="98" width="254" height="114" rx="8" fill="#12151f" stroke="#252a38"/>
  <text x="348" y="117" fill="#f4f5f8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="600">Normalized label y</text>

  <text x="348" y="137" fill="#9ba3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5">Editor dropped</text>
  <text x="578" y="137" text-anchor="end" fill="#fda4af" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="10.5" font-weight="600">y = 0</text>

  <text x="348" y="155" fill="#9ba3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5">Kept (pre-24 h)</text>
  <text x="578" y="155" text-anchor="end" fill="#9ba3b8" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="10.5" font-weight="600">y = 0.7</text>

  <text x="348" y="173" fill="#f4f5f8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="600">24 h+ result</text>
  <text x="578" y="173" text-anchor="end" fill="#ffe14d" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="10.5" font-weight="700">y = 0.4 + 0.6p</text>

  <text x="348" y="192" fill="#9ba3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="9.5">p = percentile within same streamer,</text>
  <text x="348" y="204" fill="#9ba3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="9.5">so channel size never skews ranking.</text>

  <rect x="336" y="220" width="254" height="62" rx="8" fill="#12151f" stroke="#34d399" stroke-opacity="0.35"/>
  <text x="348" y="238" fill="#6ee7b7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="600">Floor exploration</text>
  <text x="348" y="255" fill="#9ba3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10">~1 in 10 slots (≤1/hr) tests best clip</text>
  <text x="348" y="270" fill="#9ba3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10">up to 0.10 below the slot floor</text>

  <!-- ==================== COLUMN 3: BOUNDED UPDATES ==================== -->
  <rect x="634" y="58" width="298" height="236" rx="12" fill="#181c28" stroke="#2a3042"/>
  <text x="650" y="82" fill="#f4f5f8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="700">3 · BOUNDED CONTROLS</text>
  <rect x="838" y="67" width="80" height="20" rx="10" fill="#ffe14d" fill-opacity="0.14" stroke="#ffe14d" stroke-opacity="0.38"/>
  <text x="878" y="80.5" text-anchor="middle" fill="#ffe14d" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="9.5" font-weight="600">HARD LIMITS</text>

  <!-- Control 1: Weights -->
  <rect x="648" y="98" width="270" height="58" rx="8" fill="#12151f" stroke="#252a38"/>
  <text x="660" y="116" fill="#f4f5f8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="600">Ranking weights</text>
  <text x="906" y="116" text-anchor="end" fill="#6ee7b7" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="9.5">F ≥ 3.5 · ±0.03/d</text>
  <!-- Range track -->
  <rect x="660" y="126" width="246" height="6" rx="3" fill="#252a38"/>
  <rect x="684" y="126" width="134" height="6" rx="3" fill="#34d399" fill-opacity="0.75"/>
  <text x="660" y="147" fill="#9ba3b8" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="9.5">each 0.05–0.40 · sum = 1.0 (daily gate)</text>

  <!-- Control 2: Bars -->
  <rect x="648" y="164" width="270" height="58" rx="8" fill="#12151f" stroke="#252a38"/>
  <text x="660" y="182" fill="#f4f5f8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="600">Posting bars</text>
  <text x="906" y="182" text-anchor="end" fill="#ffe14d" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="9.5">24 h volume fit</text>
  <rect x="660" y="192" width="246" height="6" rx="3" fill="#252a38"/>
  <rect x="746" y="192" width="52" height="6" rx="3" fill="#ffe14d" fill-opacity="0.85"/>
  <circle cx="856" cy="195" r="4" fill="#f43f5e"/>
  <text x="660" y="213" fill="#9ba3b8" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="9.5">slot 0.35–0.55 · fast_lane ≤ 0.80</text>

  <!-- Control 3: Editor examples -->
  <rect x="648" y="230" width="270" height="52" rx="8" fill="#12151f" stroke="#252a38"/>
  <text x="660" y="248" fill="#f4f5f8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="600">Editor examples</text>
  <text x="906" y="248" text-anchor="end" fill="#c4b5fd" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="9.5">≥10 posts · top 20%</text>
  <text x="660" y="269" fill="#9ba3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10">Top 3 edits (≤200 chars, marked as data)</text>

  <!-- Bottom Fail-Safe Bar -->
  <rect x="28" y="306" width="904" height="34" rx="8" fill="#181c28" stroke="#34d399" stroke-opacity="0.38"/>
  <circle cx="46" cy="323" r="4" fill="#34d399"/>
  <text x="58" y="327" fill="#d1fae5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="500">
    Fail-safe: zero extra LLM calls · any error keeps hand-set values · control with <tspan font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" fill="#ffe14d">autoclipper learn --freeze / --unfreeze / --reset</tspan>
  </text>
</svg>
